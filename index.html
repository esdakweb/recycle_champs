<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Graph | D3.js Force Simulation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .graph-container {
      background: rgba(10, 25, 35, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 2rem;
      padding: 1rem;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    svg {
      display: block;
      width: 900px;
      height: 600px;
      border-radius: 1.5rem;
      background: radial-gradient(circle at 30% 20%, #142a3a, #051016);
      box-shadow: inset 0 0 60px rgba(0, 180, 255, 0.1);
    }

    .title {
      color: #c0e4ff;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 20px;
      text-transform: uppercase;
      font-size: 0.9rem;
      opacity: 0.8;
      border-top: 1px solid rgba(120, 200, 255, 0.2);
      padding-top: 16px;
      width: 100%;
      text-align: center;
    }

    .tooltip {
      position: absolute;
      background: #0f2636;
      color: #d0ecff;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7), 0 0 0 1px #2b6380;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="graph-container">
    <svg id="animated-graph" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="title">✦ interactive force graph · nodes pulse & drift ✦</div>

  <!-- D3.js from CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
    (function() {
      // ----- CONFIGURATION -----
      const width = 900;
      const height = 600;
      const centerX = width / 2;
      const centerY = height / 2;

      // Color palette for nodes (vibrant neon / tech)
      const colors = [
        '#4cc9f0', // cyan
        '#f72585', // pink
        '#b5179e', // purple
        '#4895ef', // blue
        '#f9c74f', // yellow
        '#43aa8b', // green
        '#f9844a', // orange
        '#577590', // slate
      ];

      // ----- DATA: 18 nodes with varied radius & group -----
      const nodes = [
        { id: 'A', radius: 22, group: 0, label: 'Alpha' },
        { id: 'B', radius: 18, group: 1, label: 'Beta' },
        { id: 'C', radius: 20, group: 2, label: 'Gamma' },
        { id: 'D', radius: 16, group: 3, label: 'Delta' },
        { id: 'E', radius: 24, group: 4, label: 'Epsilon' },
        { id: 'F', radius: 19, group: 5, label: 'Zeta' },
        { id: 'G', radius: 17, group: 6, label: 'Eta' },
        { id: 'H', radius: 21, group: 7, label: 'Theta' },
        { id: 'I', radius: 15, group: 0, label: 'Iota' },
        { id: 'J', radius: 23, group: 1, label: 'Kappa' },
        { id: 'K', radius: 18, group: 2, label: 'Lambda' },
        { id: 'L', radius: 20, group: 3, label: 'Mu' },
        { id: 'M', radius: 16, group: 4, label: 'Nu' },
        { id: 'N', radius: 22, group: 5, label: 'Xi' },
        { id: 'O', radius: 19, group: 6, label: 'Omicron' },
        { id: 'P', radius: 17, group: 7, label: 'Pi' },
        { id: 'Q', radius: 21, group: 0, label: 'Rho' },
        { id: 'R', radius: 18, group: 1, label: 'Sigma' },
      ];

      // Links: connect nodes in a semi-random mesh with some structure
      const links = [
        { source: 'A', target: 'B' }, { source: 'A', target: 'C' }, { source: 'A', target: 'D' },
        { source: 'B', target: 'E' }, { source: 'B', target: 'F' }, { source: 'C', target: 'G' },
        { source: 'C', target: 'H' }, { source: 'D', target: 'I' }, { source: 'D', target: 'J' },
        { source: 'E', target: 'K' }, { source: 'E', target: 'L' }, { source: 'F', target: 'M' },
        { source: 'F', target: 'N' }, { source: 'G', target: 'O' }, { source: 'G', target: 'P' },
        { source: 'H', target: 'Q' }, { source: 'H', target: 'R' }, { source: 'I', target: 'J' },
        { source: 'J', target: 'K' }, { source: 'K', target: 'L' }, { source: 'L', target: 'M' },
        { source: 'M', target: 'N' }, { source: 'N', target: 'O' }, { source: 'O', target: 'P' },
        { source: 'P', target: 'Q' }, { source: 'Q', target: 'R' }, { source: 'R', target: 'A' },
        { source: 'B', target: 'G' }, { source: 'C', target: 'F' }, { source: 'E', target: 'H' },
        { source: 'I', target: 'M' }, { source: 'J', target: 'N' }, { source: 'K', target: 'O' },
        { source: 'L', target: 'P' }, { source: 'Q', target: 'A' }, { source: 'D', target: 'R' }
      ];

      // Map node ids to node objects for quick lookup
      const nodeMap = new Map(nodes.map(d => [d.id, d]));

      // ----- SETUP SVG & LAYERS -----
      const svg = d3.select('#animated-graph');

      // Add a background glow filter
      const defs = svg.append('defs');
      
      // Soft glow filter for links
      const linkGlow = defs.append('filter')
        .attr('id', 'linkGlow')
        .attr('x', '-30%')
        .attr('y', '-30%')
        .attr('width', '160%')
        .attr('height', '160%');
      linkGlow.append('feGaussianBlur')
        .attr('stdDeviation', '3.5')
        .attr('result', 'blur');
      linkGlow.append('feMerge')
        .selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic'])
        .enter()
        .append('feMergeNode')
        .attr('in', d => d);

      // Glow for nodes
      const nodeGlow = defs.append('filter')
        .attr('id', 'nodeGlow')
        .attr('x', '-50%')
        .attr('y', '-50%')
        .attr('width', '200%')
        .attr('height', '200%');
      nodeGlow.append('feGaussianBlur')
        .attr('stdDeviation', '7')
        .attr('result', 'blur');
      nodeGlow.append('feMerge')
        .selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic'])
        .enter()
        .append('feMergeNode')
        .attr('in', d => d);

      // Groups for layering
      const linkGroup = svg.append('g').attr('class', 'links');
      const nodeGroup = svg.append('g').attr('class', 'nodes');
      const labelGroup = svg.append('g').attr('class', 'labels');

      // ----- FORCE SIMULATION with animation-friendly settings -----
      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links)
          .id(d => d.id)
          .distance(d => {
            // Vary link distance based on node radii for organic look
            const src = nodeMap.get(d.source.id || d.source);
            const tgt = nodeMap.get(d.target.id || d.target);
            if (src && tgt) {
              return 120 + (src.radius + tgt.radius) * 1.2;
            }
            return 150;
          })
          .strength(0.6)
        )
        .force('charge', d3.forceManyBody()
          .strength(d => -180 - d.radius * 7)  // stronger repulsion for bigger nodes
          .distanceMax(400)
        )
        .force('center', d3.forceCenter(centerX, centerY))
        .force('collision', d3.forceCollide()
          .radius(d => d.radius * 2.2)   // generous collision to keep them apart
          .strength(0.9)
          .iterations(2)
        )
        // slight x/y forces to keep them from drifting too far
        .force('x', d3.forceX(centerX).strength(0.03))
        .force('y', d3.forceY(centerY).strength(0.03))
        .alphaDecay(0.014)        // slower decay => longer animation at start
        .velocityDecay(0.32)
        .alphaMin(0.001)
        .on('tick', ticked);

      // ----- DRAW LINKS (as glowing lines) -----
      const linkElements = linkGroup.selectAll('line')
        .data(links)
        .enter()
        .append('line')
        .attr('stroke', '#7aa9c4')
        .attr('stroke-opacity', 0.45)
        .attr('stroke-width', d => {
          const src = nodeMap.get(d.source.id || d.source);
          const tgt = nodeMap.get(d.target.id || d.target);
          return 1.2 + (src.radius + tgt.radius) * 0.05;
        })
        .attr('filter', 'url(#linkGlow)');

      // ----- DRAW NODES (circles with glow and varying colors) -----
      const nodeElements = nodeGroup.selectAll('circle')
        .data(nodes)
        .enter()
        .append('circle')
        .attr('r', d => d.radius)
        .attr('fill', d => colors[d.group % colors.length])
        .attr('stroke', '#ffffff')
        .attr('stroke-width', 1.2)
        .attr('stroke-opacity', 0.5)
        .attr('filter', 'url(#nodeGlow)')
        .style('cursor', 'pointer')
        .call(d3.drag()
          .on('start', dragStarted)
          .on('drag', dragged)
          .on('end', dragEnded)
        )
        .on('mouseover', function(event, d) {
          // highlight node and its links
          d3.select(this)
            .transition()
            .duration(200)
            .attr('r', d.radius * 1.35)
            .attr('stroke-width', 2.5)
            .attr('stroke-opacity', 0.9);

          // Highlight connected links
          linkElements
            .transition()
            .duration(200)
            .attr('stroke-opacity', l => 
              (l.source.id === d.id || l.target.id === d.id) ? 0.95 : 0.15
            )
            .attr('stroke', l => 
              (l.source.id === d.id || l.target.id === d.id) ? '#c0e4ff' : '#7aa9c4'
            );
        })
        .on('mouseout', function(event, d) {
          d3.select(this)
            .transition()
            .duration(200)
            .attr('r', d.radius)
            .attr('stroke-width', 1.2)
            .attr('stroke-opacity', 0.5);

          linkElements
            .transition()
            .duration(200)
            .attr('stroke-opacity', 0.45)
            .attr('stroke', '#7aa9c4');
        });

      // ----- ADD LABELS (small text on nodes) -----
      const labelElements = labelGroup.selectAll('text')
        .data(nodes)
        .enter()
        .append('text')
        .text(d => d.label.charAt(0))  // just first letter, more clean
        .attr('font-family', 'Segoe UI, sans-serif')
        .attr('font-size', d => d.radius * 0.75)
        .attr('font-weight', '600')
        .attr('fill', '#ffffff')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('pointer-events', 'none')
        .attr('opacity', 0.9);

      // ----- PULSING ANIMATION (node radius oscillation) -----
      // We'll use a separate animation loop that gently pulses each node's radius
      // and applies it to circles and labels. This runs alongside simulation ticks.
      let pulsePhase = 0;
      
      function pulseAnimation() {
        pulsePhase += 0.015;
        
        // Update circle radii with a sine wave based on node id (to have different phases)
        nodeElements
          .attr('r', d => {
            const base = d.radius;
            // Each node pulses with its own phase shift using its index
            const idx = nodes.indexOf(d);
            const phase = pulsePhase + idx * 1.2;
            const pulse = Math.sin(phase) * 1.8; // ±1.8px
            return Math.max(6, base + pulse);
          });

        // Also update label sizes subtly and position (handled in tick)
        labelElements
          .attr('font-size', d => {
            const idx = nodes.indexOf(d);
            const phase = pulsePhase + idx * 1.2;
            const pulse = Math.sin(phase) * 1.2;
            return Math.max(8, d.radius * 0.75 + pulse);
          });

        // Link stroke-width can also breathe slightly
        linkElements
          .attr('stroke-width', l => {
            const src = nodeMap.get(l.source.id || l.source);
            const tgt = nodeMap.get(l.target.id || l.target);
            const base = 1.2 + (src.radius + tgt.radius) * 0.05;
            const idx = links.indexOf(l);
            const phase = pulsePhase * 0.8 + idx * 0.9;
            const pulse = Math.sin(phase) * 0.5;
            return Math.max(0.8, base + pulse);
          });

        requestAnimationFrame(pulseAnimation);
      }

      // Start the pulse loop
      pulseAnimation();

      // ----- TICK FUNCTION: update positions of all elements -----
      function ticked() {
        // Update link positions
        linkElements
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        // Update node positions
        nodeElements
          .attr('cx', d => d.x)
          .attr('cy', d => d.y);

        // Update label positions (center of node)
        labelElements
          .attr('x', d => d.x)
          .attr('y', d => d.y);
      }

      // ----- DRAG HANDLERS (to let users interact) -----
      function dragStarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragEnded(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      // ----- ADD A SUBTLE BACKGROUND GRADIENT / VIGNETTE (decorative) -----
      svg.append('circle')
        .attr('cx', centerX)
        .attr('cy', centerY)
        .attr('r', 450)
        .attr('fill', 'none')
        .attr('stroke', 'rgba(80, 180, 255, 0.08)')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '8 12')
        .attr('pointer-events', 'none');

      // Add some faint "stars" in the background
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const r = Math.random() * 1.5 + 0.5;
        svg.append('circle')
          .attr('cx', x)
          .attr('cy', y)
          .attr('r', r)
          .attr('fill', '#b0e0ff')
          .attr('opacity', Math.random() * 0.25 + 0.05)
          .attr('pointer-events', 'none');
      }

      // ----- RESTART SIMULATION AFTER LOAD TO INITIATE ANIMATION -----
      simulation.alpha(0.9).restart();

      // Also, to keep the graph gently moving even after simulation cools down,
      // we can set a timer to "warm" it up slightly, but not necessary — 
      // the initial animation is smooth and interactive.
      // However, we want a continuous subtle drift. Let's add a low-frequency alpha nudge every few seconds.
      setInterval(() => {
        if (simulation.alpha() < 0.1) {
          simulation.alpha(0.12).restart();
        }
      }, 4000);

    })();
  </script>
</body>
</html>
