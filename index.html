<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 Recycling Centers | Medal Ceremony</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .chart-container {
      background: rgba(10, 25, 35, 0.75);
      backdrop-filter: blur(6px);
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    svg {
      display: block;
      width: 900px;
      height: 650px;
      border-radius: 1.5rem;
      background: radial-gradient(circle at 30% 20%, #142a3a, #051016);
      box-shadow: inset 0 0 60px rgba(0, 180, 255, 0.1);
    }

    .title {
      color: #c0e4ff;
      font-weight: 300;
      letter-spacing: 4px;
      margin-top: 20px;
      text-transform: uppercase;
      font-size: 0.85rem;
      opacity: 0.8;
      border-top: 1px solid rgba(120, 200, 255, 0.2);
      padding-top: 16px;
      width: 100%;
      text-align: center;
    }

    /* Loading / error state */
    .status {
      fill: #a8d8ff;
      font-size: 16px;
      text-anchor: middle;
      font-family: 'Segoe UI', sans-serif;
      letter-spacing: 1px;
    }

    /* Axis labels */
    .axis-label {
      fill: #8fb8d4;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .grid-line {
      stroke: rgba(120, 200, 255, 0.08);
      stroke-dasharray: 3 5;
    }

    /* Medal colors */
    .medal-1 { fill: #ffd700; } /* gold */
    .medal-2 { fill: #c0c0c0; } /* silver */
    .medal-3 { fill: #cd7f32; } /* bronze */

    .bar-label {
      fill: #ffffff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .value-label {
      fill: #d0ecff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .rank-badge {
      fill: #0b1a2e;
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <svg id="medal-chart" viewBox="0 0 900 650" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="title">✦ top 10 recycling centers · medal ceremony ✦</div>

  <!-- D3.js from CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
    (function() {
      // =========================================================
      // CONFIGURATION
      // =========================================================
      const width = 900;
      const height = 650;
      const margin = { top: 100, right: 150, bottom: 60, left: 220 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      // Medal colors and styling
      const medalColors = {
        1: { main: '#ffd700', glow: '#ffea8c', label: '🥇' },
        2: { main: '#c0c0c0', glow: '#e8e8e8', label: '🥈' },
        3: { main: '#cd7f32', glow: '#e8a868', label: '🥉' }
      };
      const defaultColor = '#4cc9f0';

      // CSV file path (same folder as HTML)
      const CSV_FILE = 'recycling_centers.csv';

      // =========================================================
      // SETUP SVG
      // =========================================================
      const svg = d3.select('#medal-chart');

      // Defs for gradients and filters
      const defs = svg.append('defs');

      // Glow filter for bars
      const barGlow = defs.append('filter')
        .attr('id', 'barGlow')
        .attr('x', '-50%')
        .attr('y', '-50%')
        .attr('width', '200%')
        .attr('height', '200%');
      barGlow.append('feGaussianBlur').attr('stdDeviation', '6').attr('result', 'blur');
      barGlow.append('feMerge')
        .selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic'])
        .enter()
        .append('feMergeNode')
        .attr('in', d => d);

      // Subtle glow for text
      const textGlow = defs.append('filter')
        .attr('id', 'textGlow')
        .attr('x', '-30%')
        .attr('y', '-30%')
        .attr('width', '160%')
        .attr('height', '160%');
      textGlow.append('feGaussianBlur').attr('stdDeviation', '2').attr('result', 'blur');
      textGlow.append('feMerge')
        .selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic'])
        .enter()
        .append('feMergeNode')
        .attr('in', d => d);

      // Main group
      const chartGroup = svg.append('g')
        .attr('transform', `translate(${margin.left}, ${margin.top})`);

      // Background decorative elements (stars / confetti feel)
      const decorGroup = svg.append('g').attr('class', 'decor');
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const r = Math.random() * 1.8 + 0.4;
        decorGroup.append('circle')
          .attr('cx', x)
          .attr('cy', y)
          .attr('r', r)
          .attr('fill', '#b0e0ff')
          .attr('opacity', Math.random() * 0.25 + 0.04)
          .attr('pointer-events', 'none');
      }

      // Status message (loading / error)
      const statusText = svg.append('text')
        .attr('class', 'status')
        .attr('x', width / 2)
        .attr('y', height / 2)
        .text('Loading recycling data...');

      // =========================================================
      // LOAD CSV DATA
      // =========================================================
      d3.csv(CSV_FILE)
        .then(function(data) {
          // Parse and validate
          if (!data || data.length === 0) {
            throw new Error('CSV file is empty or missing.');
          }

          // Auto-detect column names (flexible)
          const sample = data[0];
          const keys = Object.keys(sample);
          
          // Try to find name and value columns
          const nameKey = keys.find(k =>
            /name|center|centre|facility|site|location/i.test(k)
          ) || keys[0];
          
          const valueKey = keys.find(k =>
            /value|amount|total|recycl|tons|kg|weight|score/i.test(k)
          ) || keys[1] || keys[0];

          // Process: parse numbers, filter valid rows
          let processed = data
            .map(d => ({
              name: (d[nameKey] || 'Unknown').toString().trim(),
              value: +d[valueKey] || 0
            }))
            .filter(d => d.name && !isNaN(d.value) && d.value > 0);

          if (processed.length === 0) {
            throw new Error(`No valid rows found. Detected columns: "${nameKey}", "${valueKey}".`);
          }

          // Sort descending and take top 10
          processed.sort((a, b) => b.value - a.value);
          const top10 = processed.slice(0, 10);

          // Compute max value for scale
          const maxValue = d3.max(top10, d => d.value);

          // =========================================================
          // SCALES
          // =========================================================
          const xScale = d3.scaleLinear()
            .domain([0, maxValue * 1.15])
            .range([0, innerWidth]);

          const yScale = d3.scaleBand()
            .domain(top10.map(d => d.name))
            .range([0, innerHeight])
            .padding(0.22);

          const barHeight = yScale.bandwidth();

          // =========================================================
          // DRAW AXES / GRID
          // =========================================================
          const gridGroup = chartGroup.append('g').attr('class', 'grid');
          
          const xTicks = xScale.ticks(6);
          xTicks.forEach(tick => {
            gridGroup.append('line')
              .attr('class', 'grid-line')
              .attr('x1', xScale(tick))
              .attr('x2', xScale(tick))
              .attr('y1', -20)
              .attr('y2', innerHeight + 10);
            
            gridGroup.append('text')
              .attr('x', xScale(tick))
              .attr('y', innerHeight + 35)
              .attr('text-anchor', 'middle')
              .attr('class', 'axis-label')
              .text(d3.format('.2s')(tick));
          });

          // Axis title
          chartGroup.append('text')
            .attr('class', 'axis-label')
            .attr('x', innerWidth / 2)
            .attr('y', innerHeight + 55)
            .attr('text-anchor', 'middle')
            .text('TOTAL RECYCLED (units)');

          // =========================================================
          // DRAW BARS (with animation)
          // =========================================================
          const barsGroup = chartGroup.append('g').attr('class', 'bars');

          top10.forEach((d, i) => {
            const rank = i + 1;
            const isMedal = rank <= 3;
            const color = isMedal ? medalColors[rank].main : defaultColor;
            const glowColor = isMedal ? medalColors[rank].glow : '#4cc9f0';

            const barY = yScale(d.name);

            // Create a group per bar for easier animation
            const barGroup = barsGroup.append('g')
              .attr('class', `bar-group bar-${rank}`)
              .attr('transform', `translate(0, ${barY})`);

            // Background track (subtle)
            barGroup.append('rect')
              .attr('x', 0)
              .attr('y', 0)
              .attr('width', innerWidth)
              .attr('height', barHeight)
              .attr('rx', barHeight / 2)
              .attr('fill', 'rgba(80, 140, 180, 0.08)');

            // Animated bar (starts at width 0)
            const bar = barGroup.append('rect')
              .attr('class', 'bar-rect')
              .attr('x', 0)
              .attr('y', 0)
              .attr('width', 0)  // will animate
              .attr('height', barHeight)
              .attr('rx', barHeight / 2)
              .attr('fill', color)
              .attr('opacity', 0.92)
              .attr('filter', 'url(#barGlow)')
              .style('transform-origin', 'left center');

            // Animate bar growth with stagger
            const finalWidth = Math.max(8, xScale(d.value));
            bar.transition()
              .delay(300 + i * 130)
              .duration(1100)
              .ease(d3.easeCubicOut)
              .attr('width', finalWidth);

            // Pulsing glow overlay on the bar
            const pulseRect = barGroup.append('rect')
              .attr('x', 0)
              .attr('y', 0)
              .attr('width', 0)
              .attr('height', barHeight)
              .attr('rx', barHeight / 2)
              .attr('fill', 'none')
              .attr('stroke', glowColor)
              .attr('stroke-width', 1.5)
              .attr('opacity', 0);

            pulseRect.transition()
              .delay(300 + i * 130)
              .duration(1100)
              .ease(d3.easeCubicOut)
              .attr('width', finalWidth);

            // Set up a continuous pulse animation using requestAnimationFrame
            // We'll store the final width on the element for the pulse loop
            pulseRect.node().__finalWidth = finalWidth;
            pulseRect.node().__baseOpacity = isMedal ? 0.7 : 0.4;
            pulseRect.node().__delayOffset = i * 0.7;

            // Rank badge circle (medal indicator)
            const badgeRadius = barHeight * 0.38;
            barGroup.append('circle')
              .attr('cx', -badgeRadius - 12)
              .attr('cy', barHeight / 2)
              .attr('r', badgeRadius)
              .attr('fill', isMedal ? medalColors[rank].main : 'rgba(120, 180, 220, 0.25)')
              .attr('stroke', isMedal ? '#fff' : 'rgba(180, 220, 255, 0.4)')
              .attr('stroke-width', isMedal ? 2 : 1);

            // Rank number inside badge
            barGroup.append('text')
              .attr('class', 'rank-badge')
              .attr('x', -badgeRadius - 12)
              .attr('y', barHeight / 2)
              .attr('font-size', barHeight * 0.42)
              .attr('fill', isMedal ? '#0b1a2e' : '#a8d8ff')
              .text(rank);

            // Medal emoji for top 3 (placed to the right of the bar)
            if (isMedal) {
              barGroup.append('text')
                .attr('x', finalWidth + 12)
                .attr('y', barHeight / 2 + 2)
                .attr('font-size', barHeight * 0.75)
                .attr('dominant-baseline', 'central')
                .attr('opacity', 0)
                .text(medalColors[rank].label)
                .transition()
                .delay(1400 + i * 130)
                .duration(400)
                .attr('opacity', 1);
            }

            // Center name label (inside or left of bar)
            barGroup.append('text')
              .attr('class', 'bar-label')
              .attr('x', -badgeRadius * 2 - 24)
              .attr('y', barHeight / 2 + 1)
              .attr('text-anchor', 'end')
              .attr('dominant-baseline', 'central')
              .text(d.name.length > 22 ? d.name.substring(0, 20) + '…' : d.name)
              .style('opacity', 0)
              .transition()
              .delay(300 + i * 130)
              .duration(600)
              .style('opacity', 1);

            // Value label (animated counting up)
            const valueLabel = barGroup.append('text')
              .attr('class', 'value-label')
              .attr('x', finalWidth + (isMedal ? 45 : 12))  // shift if medal emoji present
              .attr('y', barHeight / 2 + 1)
              .attr('dominant-baseline', 'central')
              .attr('text-anchor', 'start')
              .attr('filter', 'url(#textGlow)')
              .style('opacity', 0);

            // Count-up animation
            valueLabel.transition()
              .delay(400 + i * 130)
              .duration(1200)
              .ease(d3.easeCubicOut)
              .style('opacity', 1)
              .tween('text', function() {
                const interpolator = d3.interpolateNumber(0, d.value);
                return function(t) {
                  d3.select(this).text(d3.format(',.0f')(interpolator(t)));
                };
              });
          });

          // =========================================================
          // CONTINUOUS PULSE ANIMATION LOOP
          // =========================================================
          let pulsePhase = 0;
          function pulseLoop() {
            pulsePhase += 0.03;

            // Pulse the stroke rects
            d3.selectAll('.bars rect[stroke]').each(function() {
              const el = d3.select(this);
              const finalW = this.__finalWidth || 0;
              const baseOp = this.__baseOpacity || 0.4;
              const offset = this.__delayOffset || 0;
              const pulse = Math.sin(pulsePhase + offset) * 0.5 + 0.5;
              el.attr('opacity', baseOp * pulse * 0.8 + 0.1);
              el.attr('stroke-width', 1.2 + pulse * 1.2);
            });

            // Subtle background star twinkle
            d3.selectAll('.decor circle').each(function() {
              const el = d3.select(this);
              const baseOp = +el.attr('data-base-op') || 0.1;
              el.attr('opacity', baseOp + Math.sin(pulsePhase * 2 + Math.random()) * 0.05);
            });

            requestAnimationFrame(pulseLoop);
          }

          // Store base opacity for stars
          d3.selectAll('.decor circle').each(function() {
            d3.select(this).attr('data-base-op', this.getAttribute('opacity'));
          });

          // Start pulse loop
          pulseLoop();

          // Remove status message
          statusText.remove();

          // Add a celebratory title
          chartGroup.append('text')
            .attr('x', innerWidth / 2)
            .attr('y', -55)
            .attr('text-anchor', 'middle')
            .attr('fill', '#c0e4ff')
            .attr('font-size', '18px')
            .attr('font-weight', '300')
            .attr('letter-spacing', '4px')
            .style('opacity', 0)
            .text('★ TOP RECYCLERS ★')
            .transition()
            .delay(200)
            .duration(800)
            .style('opacity', 0.9);

          // Subtle confetti-like particles falling
          startConfetti();
        })
        .catch(function(error) {
          console.error('Error loading CSV:', error);
          statusText
            .attr('fill', '#ff8080')
            .text('⚠ Could not load "' + CSV_FILE + '". Check console for details.');
          
          // Add a helpful hint
          svg.append('text')
            .attr('x', width / 2)
            .attr('y', height / 2 + 35)
            .attr('class', 'status')
            .attr('fill', '#a8d8ff')
            .attr('font-size', '13px')
            .attr('opacity', 0.7)
            .text('Place recycling_centers.csv in the same folder as this HTML file.');
        });

      // =========================================================
      // CONFETTI ANIMATION (medal ceremony feel)
      // =========================================================
      function startConfetti() {
        const confettiGroup = svg.append('g')
          .attr('class', 'confetti')
          .attr('pointer-events', 'none');

        const confettiColors = ['#ffd700', '#c0c0c0', '#cd7f32', '#4cc9f0', '#f72585', '#43aa8b'];

        for (let i = 0; i < 40; i++) {
          const startX = Math.random() * width;
          const startY = -20 - Math.random() * 100;
          const size = Math.random() * 6 + 3;
          const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
          const rotation = Math.random() * 360;
          const duration = 4000 + Math.random() * 4000;
          const delay = Math.random() * 3000;

          const particle = confettiGroup.append('rect')
            .attr('x', startX)
            .attr('y', startY)
            .attr('width', size)
            .attr('height', size * 0.6)
            .attr('fill', color)
            .attr('opacity', 0.85)
            .attr('rx', 1)
            .attr('transform', `rotate(${rotation}, ${startX}, ${startY})`);

          function fall() {
            particle
              .transition()
              .delay(delay)
              .duration(duration)
              .ease(d3.easeLinear)
              .attr('y', height + 40)
              .attr('transform', `rotate(${rotation + 360 * 2}, ${startX}, ${startY + 600})`)
              .attr('opacity', 0)
              .on('end', function() {
                // Reset and loop
                particle
                  .attr('y', startY - Math.random() * 200)
                  .attr('opacity', 0.85)
                  .transition()
                  .duration(0)
                  .on('end', fall);
              });
          }
          fall();
        }
      }
    })();
  </script>
</body>
</html>
